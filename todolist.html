<html>
    <head>
        <style>
*{
    border: noe;
    outline: none;
    padding:0;
    margin: 0;
    box-sizing: border-box;
    background-color: rgb(104, 86, 86);
}

.todolistfirm{
  width:750px;
  height:892px;

  margin: auto 20%;
  padding: 50px;
  border-radius:8px;

            }

.btnandtext{
    width:100%;
    height:90px;
    border-color: rgb(199, 196, 255);
    padding:30px;
    display:flex;
    justify-content:space-around;
align-items:center;
flex-direction:row;
font-size:18px;
font-weight:bold;
text-align: center;
border: darkblue 2px solid;
    
}


h1{
    background-color: rgb(219, 134, 23);
     margin: auto 20%;
     border: 2px dashed black;
     padding:15px;
     margin: 25px;
     text-align: center;
     text-transform: uppercase;
}
.btn{
    width:40%;
    height:40px;
    padding: 12px;
    background-color: rgb(50, 215, 45);
    font-size:18px;
    font-weight: bold;
    

}
input[type="text"]{
    background-color:white;
    outline: none;
    border: 1px solid rgb(18, 18, 228);
   
    font-size: 20px;
}
.onlybtn{
    width:20%;
    height:40px;
    position: relative;
}
.onlybtn:hover::after{
    content:"you can use Enter key";
    position: absolute;
    width:240px;
    height:40px;
    left:115px;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    bottom:-1px;
   background-color: rgb(244, 227, 42);
}
.todolistdivandremovebtn{
    display: flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
    font-size:20px;
    color: white;
    font-weight: bold;
    width:100% ;
    height: 30px;
    padding:35px;
    border:1px solid rgb(47, 186, 255);

}
.todolistremovebtn{
    width:60px;
    height:30px;
    background-color: rgb(25, 145, 9);
}
.todolistremovebtn:hover{
    background-color: rgb(106, 134, 149);
    transform:scale(1.5);
}

        </style>
    </head>

    <body>

<div id="todolistfirm" class="todolistfirm">
    <h1>to do list</h1>
    <div id="btnandtext" class="btnandtext">
<input type="text" id="textinputinputarea" class="textinputinputarea btn "/>
<button id="todolistbtn" class="todolistbtn btn  onlybtn">Add</button>
</div>
<div id="textinputresult"></div>
</div>

        <script>
let textinputinputarea=document.getElementById("textinputinputarea");
let todolistbtn=document.querySelector("#todolistbtn");
let textinputresult=document.querySelector("#textinputresult");
let todolistfirm =document.querySelector("#todolistfirm ");
try{
todolistbtn.addEventListener("click",ggx);
function ggx(){
    let   textinputvalue= textinputinputarea.value;
    let todolistdiv=document.createElement("div");
    todolistdiv.innerHTML=textinputvalue;
    let todolistremovebtn=document.createElement("button");
    todolistremovebtn.innerHTML="Remove";
    todolistremovebtn.className="todolistremovebtn";
      let todolistdivandremovebtn=document.createElement("div");
     todolistdivandremovebtn.className="todolistdivandremovebtn";
    todolistfirm.classList.add("todolistfirm");
     todolistfirm.classList.add("todolistfirm");
     if(textinputvalue.length==""){
         todolistremovebtn.style.display="none";
           todolistdivandremovebtn.classList.remove(" todolistdivandremovebtn");
     }
      todolistremovebtn.addEventListener("click",function(){
        todolistdivandremovebtn.remove();
      })
      todolistdivandremovebtn.appendChild(todolistdiv);
     todolistdivandremovebtn.appendChild(todolistremovebtn);
    
     textinputresult.appendChild(todolistdivandremovebtn);
  
    textinputinputarea.value="";
}

document.addEventListener("keydown",function(e){
    if(e.key=="Enter"){
      ggx();
    }
});
}

catch(error){
console.log("Error");
}
finally{
    console.log("Finished");
}

        </script>
    </body>
</html>
